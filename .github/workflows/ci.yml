#
# PR CI for the UAT harness itself.
# =================================
# Distinct from uat.yml (the release acceptance gate, which only fires on
# release dispatch / nightly / manual): this validates the *harness code* on
# every pull request and push to main, so changes to src/, tests/, the scenario
# fixtures and the setup scripts can't merge unchecked.
#
# (The TypeScript harness jobs below are the future; `check` and `e2e` are the legacy
# Rust harness, deleted with src/, tests/*.rs and projects/ at switch-over.)
#
# Two legacy jobs:
#   * check — hermetic and fast: fmt, clippy, the lib unit tests, a build, and
#     shellcheck on the cloud-setup scripts. No network, no Erlang.
#   * e2e   — installs Erlang/OTP and runs the full #[ignore]d scenario suite
#     against the EDGE bundle (one Linux leg; the cross-platform matrix lives in
#     uat.yml). If the rolling `edge` pre-release isn't published yet the harness
#     skips this leg cleanly rather than failing the gate (BT-2497).
#     Edge — not latest — because the harness is developed against the
#     toolchain tip: edge is the rolling Linux pre-release beamtalk republishes
#     on every merge to main (edge.yml), so it always carries features that have
#     landed but aren't in a tagged release yet, with no nightly-cadence lag.
#     This exercises the drivers end-to-end before merge —
#     the only place harness changes meet a real toolchain, since the scenarios
#     need a BEAM runtime the dev box may lack. The release gate (uat.yml) is
#     what validates a specific tagged version.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── The TypeScript harness (ADR 0154) ───────────────────────────────────
  # Hermetic: typecheck + the harness's tests of itself. No toolchain, no network.
  # Runs on Linux and Windows because process-tree kill and path handling differ.
  harness:
    name: Harness (typecheck, self-tests) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Harness self-tests
        run: npx playwright test --project=harness --trace off
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: harness-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # The plumbing smoke against the EDGE bundle through the selector path: the one
  # place a harness change meets a real toolchain before merge. A skipped edge
  # (not published yet) is not a failure of this PR.
  smoke:
    name: Smoke vs edge (selector path)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and install edge
        id: prep
        env:
          BEAMTALK_UAT_VERSION: edge
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run install-toolchain
      - name: Smoke
        if: steps.prep.outputs.skipped != 'true'
        env:
          CI: 'true'
        run: npx playwright test --project=smoke --trace off
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # ─── LEGACY Rust harness: runs until BT-5305 switches uat.yml over ─────────
  check:
    name: Check (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Unit tests (hermetic — no toolchain install)
        run: cargo test --lib

      - name: Shellcheck setup scripts
        run: shellcheck scripts/setup-cloud.sh .claude/hooks/session-start.sh

  e2e:
    name: E2E scenarios vs edge
    # Pinned, not `ubuntu-latest`: that image moved to ImageOS `ubuntu26`,
    # which erlef/setup-beam doesn't recognise ("Tried to map a target OS from
    # env. variable 'ImageOS'"). Same fix as uat.yml's windows-2022 leg.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # OTP/rebar3 versions come from .tool-versions (the single source of truth,
      # mirroring jamesc/beamtalk) — never hardcoded here, so this leg always
      # tracks the toolchain the released bundle is built against.
      - name: Install Erlang/OTP
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          version-file: .tool-versions
          version-type: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build harness
        run: cargo build --tests

      # The harness installs the released bundle via `gh release download` from
      # jamesc/beamtalk, so `gh` must be authenticated. GITHUB_TOKEN works for
      # public-repo release reads; `gh` is preinstalled on GitHub runners.
      - name: Run scenario suite against edge
        shell: bash
        env:
          BEAMTALK_UAT_VERSION: edge
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --tests -- --ignored --nocapture
